<div class="blog-search" role="search">
  <input id="blog-search-input" class="blog-search-input" type="search" placeholder="Sök bland recepten, t.ex. lamm, tryffel, dessert …"
         aria-label="Sök i bloggen" autocomplete="off" enterkeyhint="search"
         data-one="1 träff" data-many="{n} träffar">
  <button type="button" class="blog-search-clear" id="blog-search-clear" aria-label="Rensa sökningen" hidden>&times;</button>
  <p class="blog-search-status" id="blog-search-status" aria-live="polite"></p>
</div>
<p class="blog-search-empty" id="blog-search-empty" hidden>Inga artiklar matchade din sökning.</p>
<script src="/assets/js/blog-search.js" defer></script>
